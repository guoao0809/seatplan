<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教室排座</title>
    <style>
      /* Vue 挂载前的启动骨架：占住白屏期，避免看到空白窗口 */
      html, body, #app { height: 100%; margin: 0; }
      body { background: #1F2329; }
      .boot { display: flex; height: 100%; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      .boot__logo { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #4F6BF6, #6E8BF7); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; font-weight: 700; }
      .boot__text { color: #8A93A6; font-size: 13px; }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="boot">
        <div class="boot__logo">座</div>
        <div class="boot__text">正在启动…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
